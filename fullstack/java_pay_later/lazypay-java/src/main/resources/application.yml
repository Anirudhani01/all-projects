spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DB:lazypay}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    tags:
      application: lazypay
