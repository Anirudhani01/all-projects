{% extends "base.html" %}
{% block content %}
<h2>Admin - Product Stock Management</h2>
<table border="1">
  <tr>
    <th>Product</th>
    <th>Category</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Action</th>
  </tr>
  {% for p in products %}
  <tr>
    <td>{{ p.name }}</td>
    <td>{{ p.category }}</td>
    <td>₹{{ p.price }}</td>
    <td>{{ p.stock }}</td>
    <td>
      <form method="post" action="/admin/restock">
        <input type="hidden" name="product_id" value="{{ p.id }}">
        <input type="number" name="quantity" min="1" max="10" required>
        <button type="submit">Restock</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
