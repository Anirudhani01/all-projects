<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electronics Shop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .options {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
    }
    .option-box {
      border: 2px solid #444;
      padding: 20px;
      width: 150px;
      border-radius: 8px;
      cursor: pointer;
      background-color: #f9f9f9;
    }
    .option-box:hover {
      background-color: #e0e0e0;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Electronics Store</h1>
  <div class="options">
    <a href="/products/laptops"><div class="option-box">Laptops</div></a>
    <a href="/products/mobiles"><div class="option-box">Mobiles</div></a>
    <a href="/products/smartwatch"><div class="option-box">Smartwatch</div></a>
    <a href="/products/tv"><div class="option-box">TV</div></a>
  </div>
</body>
</html>
