[project]
name = "ecommerce-test-automation"
version = "0.1.0"
description = "Advanced test automation framework for ecommerce CLI application"
authors = [{ name = "Test Automation Engineer", email = "test@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.5.0",
    "jinja2>=3.1.2",
    "ollama>=0.2.1",
    "openai>=1.3.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=4.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "selenium>=4.15.0",
    "beautifulsoup4>=4.12.0",
    "faker>=20.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "jsonschema>=4.19.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
ecommerce = "ecommerce_cli.main:cli"
test-generator = "test_automation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecommerce_cli", "test_automation"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
