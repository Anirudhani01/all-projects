<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Hospital - Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-portal {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #718096;
            margin-bottom: 3rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            min-width: 160px;
            justify-content: center;
        }
        
        .btn-login {
            background: #667eea;
            color: white;
        }
        
        .btn-login:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .btn-website {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-website:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .info-card {
            padding: 1.5rem;
            background: #f7fafc;
            border-radius: 10px;
            text-align: center;
        }
        
        .info-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .info-text {
            font-size: 0.9rem;
            color: #4a5568;
            font-weight: 500;
        }
        
        .security-notice {
            background: #fffaf0;
            border: 1px solid #f6ad55;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            color: #c53030;
            font-size: 0.9rem;
        }
        
        .debug-info {
            background: #f0f8ff;
            border: 1px solid #4299e1;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            color: #2b6cb0;
            font-size: 0.8rem;
            font-family: monospace;
        }
        
        @media (max-width: 480px) {
            .action-buttons {
                flex-direction: column;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-portal {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-portal">
        <div class="logo">
            <i class="fas fa-heartbeat"></i>
        </div>
        <h1 class="title">MediCare Hospital</h1>
        <p class="subtitle">Administrative Portal</p>
        
        <div class="action-buttons">
            <a href="login.html" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Admin Login
            </a>
            <a href="../index.html" class="btn btn-website">
                <i class="fas fa-home"></i>
                Public Website
            </a>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-tachometer-alt"></i>
                </div>
                <div class="info-text">Dashboard</div>
            </div>
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-user-md"></i>
                </div>
                <div class="info-text">Doctors</div>
            </div>
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="info-text">Appointments</div>
            </div>
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="info-text">Patients</div>
            </div>
        </div>
        
        <div class="security-notice">
            <i class="fas fa-shield-alt"></i>
            Authorized personnel only. Please log in to access the admin dashboard.
        </div>
        
        <div class="debug-info">
            <strong>Debug Info:</strong><br>
            Page Type: Admin Landing Page<br>
            Loaded at: <span id="load-time"></span><br>
            No scripts loaded - safe to use
        </div>
    </div>
    
    <script>
        // Add simple debug info
        document.getElementById('load-time').textContent = new Date().toLocaleString();
        
        // Prevent any accidental redirects
        console.log('Admin index page loaded - no redirects should happen');
        
        // Clear any existing localStorage that might cause issues
        if (localStorage.getItem('admin_token')) {
            console.log('Clearing existing admin token to prevent auto-login');
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
        }
    </script>
</body>
</html>
